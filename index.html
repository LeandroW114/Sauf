<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>SAUF — Minenfeld</title>
<style>
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --muted: rgba(255, 255, 255, 0.4);
    --line: rgba(255, 255, 255, 0.14);
    --tile: #121212;
    --tile-active: #1a1a1a;
    --safe: #2dff88;
    --danger: #ff1f3d;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ───────────────────────────── */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: max(20px, env(safe-area-inset-top)) 24px 0;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  header .status {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* ── Spielfeld ────────────────────────── */
  main {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 24px;
  }

  .board {
    width: min(88vw, 400px);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .tile {
    aspect-ratio: 1;
    background: var(--tile);
    border: 1px solid var(--line);
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
    padding: 10px 12px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    transition:
      background 0.25s ease,
      border-color 0.25s ease,
      opacity 0.45s ease 0.25s,
      transform 0.45s ease 0.25s;
  }

  .tile:active { background: var(--tile-active); }

  .tile.is-safe {
    background: rgba(45, 255, 136, 0.12);
    border-color: rgba(45, 255, 136, 0.5);
    color: var(--safe);
    opacity: 0;
    transform: scale(0.9);
    pointer-events: none;
  }

  .tile.is-mine {
    background: var(--danger);
    border-color: var(--danger);
    color: var(--bg);
  }

  .board.is-locked .tile { pointer-events: none; }

  /* ── Detonation ───────────────────────── */
  .flash {
    position: fixed;
    inset: 0;
    background: var(--danger);
    opacity: 0;
    pointer-events: none;
    z-index: 10;
  }

  body.is-detonating .flash {
    animation: flash 0.7s ease-out;
  }

  @keyframes flash {
    0%   { opacity: 0; }
    12%  { opacity: 0.95; }
    30%  { opacity: 0.35; }
    45%  { opacity: 0.75; }
    100% { opacity: 0; }
  }

  body.is-detonating main {
    animation: shake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97);
  }

  @keyframes shake {
    10%, 90%      { transform: translate(-2px, 1px); }
    20%, 80%      { transform: translate(5px, -2px); }
    30%, 50%, 70% { transform: translate(-9px, 3px); }
    40%, 60%      { transform: translate(9px, -3px); }
    100%          { transform: translate(0, 0); }
  }

  /* ── Strafkarte ───────────────────────── */
  .penalty {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 24px;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  .penalty.is-visible { display: flex; }

  .penalty .card {
    width: min(88vw, 420px);
    background: var(--bg);
    border: 1px solid var(--danger);
    padding: 32px 28px 28px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9);
    animation: card-in 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1) 0.15s both;
  }

  @keyframes card-in {
    from { opacity: 0; transform: translateY(30px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .penalty .kicker {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--danger);
  }

  .penalty .text {
    font-size: clamp(24px, 6.5vw, 36px);
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    text-wrap: balance;
  }

  .penalty .reset {
    background: none;
    border: 0;
    font: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    padding: 12px 20px;
    animation: card-in 0.4s ease 0.4s both;
    transition: color 0.2s ease;
  }

  .penalty .reset:hover,
  .penalty .reset:focus-visible { color: var(--fg); }
  .penalty .reset:focus-visible { outline: 1px solid var(--line); }
  .penalty .reset:active { transform: scale(0.96); }

  /* ── Footer ───────────────────────────── */
  footer {
    padding: 0 24px max(20px, env(safe-area-inset-bottom));
    text-align: center;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    body.is-detonating main { animation: none; }
    body.is-detonating .flash { animation-duration: 0.2s; }
  }
</style>
</head>
<body>

  <header>
    <span class="brand">SAUF® MINENFELD</span>
    <span class="status" id="status"></span>
  </header>

  <main>
    <div class="board" id="board"></div>
  </main>

  <footer>Ein Feld ist scharf. Tippt reihum.</footer>

  <div class="flash"></div>

  <div class="penalty" id="penalty">
    <div class="card">
      <span class="kicker">Mine getroffen</span>
      <p class="text" id="penaltyText"></p>
    </div>
    <button class="reset" id="reset" type="button">Neue Runde</button>
  </div>

<script>
(() => {
  "use strict";

  const TILE_COUNT = 12; // 3 x 4

  const PENALTIES = [
    "Minenopfer. Trinke 3 Schlucke und tu so, als wäre nichts gewesen.",
    "Volltreffer. 5 Schlucke — und die nächste Runde spielst du auf den Knien.",
    "Boom. Tausche dein Getränk mit der Person links von dir und trinke 2.",
    "Detoniert. Trinke 4 und übernimm die Aux — jeder Skip kostet dich einen Schluck.",
    "Alle zeigen jetzt auf dich. Trinke so viele Schlucke, wie Finger auf dich zeigen.",
    "Kaboom. 5 Schlucke, und dein Handy liegt bis zur nächsten Mine in der Mitte.",
    "Direkter Treffer. Ex dein Getränk oder trinke 6 — deine Wahl, Soldat."
  ];

  const board = document.getElementById("board");
  const statusEl = document.getElementById("status");
  const penaltyEl = document.getElementById("penalty");
  const penaltyText = document.getElementById("penaltyText");
  const resetBtn = document.getElementById("reset");

  let mineIndex = -1;
  let remaining = TILE_COUNT;
  let exploded = false;

  function updateStatus() {
    statusEl.textContent = `${remaining}/${TILE_COUNT} Felder`;
  }

  function buildBoard() {
    board.innerHTML = "";
    board.classList.remove("is-locked");
    mineIndex = Math.floor(Math.random() * TILE_COUNT);
    remaining = TILE_COUNT;
    exploded = false;

    for (let i = 0; i < TILE_COUNT; i++) {
      const tile = document.createElement("button");
      tile.type = "button";
      tile.className = "tile";
      tile.textContent = String(i + 1).padStart(2, "0");
      tile.addEventListener("click", () => onTileTap(tile, i), { once: true });
      board.appendChild(tile);
    }
    updateStatus();
  }

  function onTileTap(tile, i) {
    if (exploded) return;
    if (i === mineIndex) {
      detonate(tile);
    } else {
      tile.classList.add("is-safe");
      remaining -= 1;
      updateStatus();
    }
  }

  function detonate(tile) {
    exploded = true;
    board.classList.add("is-locked");
    tile.classList.add("is-mine");

    if (navigator.vibrate) navigator.vibrate([120, 60, 200]);

    document.body.classList.add("is-detonating");
    setTimeout(() => document.body.classList.remove("is-detonating"), 750);

    setTimeout(() => {
      penaltyText.textContent =
        PENALTIES[Math.floor(Math.random() * PENALTIES.length)];
      penaltyEl.classList.add("is-visible");
    }, 650);
  }

  resetBtn.addEventListener("click", () => {
    penaltyEl.classList.remove("is-visible");
    buildBoard();
  });

  buildBoard();
})();
</script>
</body>
</html>
